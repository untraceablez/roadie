# Generic compose file: builds the image from this checkout, or pulls the
# published one (`docker compose pull`). For Unraid see docker-compose.unraid.yml.
services:
  roadie:
    image: ghcr.io/untraceablez/roadie:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/roadie.db
    volumes:
      - roadie-data:/data

volumes:
  roadie-data:
